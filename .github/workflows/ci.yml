name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # POSIX only, deliberately: the central test SIGKILLs a real child process.
    # os.replace is atomic on Windows too, but the proof this package rests on
    # cannot be run there, and shipping an unproven claim is the thing it is
    # against.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest was here and is deliberately gone. Across two runs, all
        # TEN macOS jobs were CANCELLED with zero steps ever started -- queued
        # 18:32:24, killed 18:57:10, no runner ever allocated to this account.
        # A job that cannot be scheduled reds the badge while proving nothing,
        # and a matrix entry that never executes is a coverage claim with no
        # alarm on it. The README states what actually ran. Re-add it the day
        # a macOS runner allocates, and let the run be the evidence.
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (warnings are errors)
        env:
          PYTHONPATH: src
        # -W is an INTERPRETER flag, so it has to precede -m. Passed after it,
        # argparse inside unittest's own CLI rejects it -- "unrecognized
        # arguments: -W", exit 2, before a single test runs. The job fails for
        # a reason that has nothing to do with the package, and the promotion
        # the flag was added for never takes effect.
        run: python -W error::ResourceWarning -m unittest discover -s tests -t tests -v
